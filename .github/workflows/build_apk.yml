name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Für Release erstellen
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: |
        cd apps/client
        flutter pub get
    
    - name: Build APK
      run: |
        cd apps/client
        flutter build apk --debug
    
    - name: Create Release with direct APK
      if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: apps/client/build/app/outputs/flutter-apk/app-debug.apk
        generate_release_notes: true
        tag_name: ${{ github.ref_name }}
    
    - name: Create Release on push (auto-generated tag)
      if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: apps/client/build/app/outputs/flutter-apk/app-debug.apk
        generate_release_notes: true
        tag_name: auto-build-${{ github.run_number }}
        name: Auto Build ${{ github.run_number }}
        body: |
          Automatischer Build vom Push auf main.
          Direkter APK Download unten.
