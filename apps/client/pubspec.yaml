name: nutrition_app
description: "Project Nutrition - Function-First MVP (Offline Mode)"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Networking (kept for future server mode)
  dio: ^5.7.0
  
  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  
  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.5
  uuid: ^4.5.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  
  # UI
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^14.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  
  # Localization
  generate: true

  # Theme assets
  # assets:
  #   - assets/images/
